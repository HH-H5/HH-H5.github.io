<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HH-H5が提供するアプリの公式サポートサイトです。">
  <title>HH-H5 App Support</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(680px, 100%); }
    .eyebrow { color: #526783; font-size: .82rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 8px 0 12px; font-size: clamp(2rem, 8vw, 4rem); letter-spacing: -.04em; }
    .lead { margin: 0 0 28px; color: #526071; line-height: 1.8; }
    .card { display: flex; align-items: center; gap: 18px; padding: 22px; color: inherit; background: #fff; border: 1px solid #dce3ed; border-radius: 24px; text-decoration: none; box-shadow: 0 18px 50px rgba(42, 57, 78, .09); }
    .card:hover { border-color: #7a92ff; transform: translateY(-1px); }
    .card img { width: 76px; height: 76px; border-radius: 18px; }
    .card strong { display: block; margin-bottom: 7px; font-size: 1.25rem; }
    .card span { color: #5d6879; line-height: 1.6; }
    footer { margin-top: 24px; color: #738094; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Official support</p>
    <h1>HH-H5 App Support</h1>
    <p class="lead">HH-H5が提供するアプリのサポート情報、よくある質問、プライバシーポリシーをご案内します。</p>
    <a class="card" href="SimpleMemorize/">
      <img src="app-icon.png" alt="SimpleMemorizeのアプリアイコン">
      <span><strong>SimpleMemorize</strong>シンプルな操作で、問題と解答を繰り返し確認できる暗記アプリ。</span>
    </a>
    <footer>© 2026 HH-H5</footer>
  </main>
</body>
</html>
